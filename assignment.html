<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div style="text-align: center; width: 300px; height: 300px; border: 1px solid black; margin: auto;">
            <h1>Online Shop</h1>
            <h2>Tea:100</h2>
            <h2>Coffee:200</h2>
            <h2>Rice:500</h2>
            <h2>Wheat:400</h2>
            <button onclick="myFunction()">Buy now</button>
    </div>
    <script>
       function myFunction() {
            let a = prompt("Enter the product name");
            let b = prompt("Enter the quantity");
            if (a == "Tea") {
                document.write("Total price is: " + (100 * b));
            } else if (a == "Coffee") {
                document.write("Total price is: " + (200 * b));
            } else if (a == "Rice") {
                document.write("Total price is: " + (500 * b));
            } else if (a == "Wheat") {
                document.write("Total price is: " + (400 * b));
            } else {
                document.write("Product not available");
            }
       }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Task Manager</title>
</head>
<body style="display:flex; justify-content:center; align-items:center; height:100vh;">

  <!-- Rectangle box in center -->
  <div style="border:1px solid black; width:400px; padding:20px; text-align:center;">

    <h1>Student Task Manager</h1>

    <!-- Task input -->
    <div style="margin-bottom:15px;">
      <input type="text" placeholder="Enter your task">
      <button style="background-color:blue; color:white;">Add Task</button>
    </div>

    <!-- Task statistics in one horizontal line with box -->
    <div style="margin-bottom:15px; display:flex; justify-content:space-around; border:1px solid gray; padding:10px;">
      <div>Total Task 5</div>
      <div>Completed 4</div>
      <div>Pending 1</div>
    </div>

    <!-- Filters -->
    <div style="margin-bottom:15px;">
      <button>All</button>
      <button>Pending</button>
      <button>Completed</button>
    </div>

    <!-- Task list -->
    <div style="text-align:left; border:1px solid gray; padding:10px;">
      <input type="checkbox">
      SIH Project
      <button style="background-color:red; color:white;">Delete</button>
    </div>

  </div>
</body>
</html>
